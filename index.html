.g button:disabled{opacity:.5}

async function readLS(k, key) {
  const raw = localStorage.getItem(k); if (!raw) return null;
  if (raw.startsWith('enc:')) { if (!key) throw new Error('locked'); return JSON.parse(td.decode(await dec(key, JSON.parse(raw.slice(4))))); }
  if (key) B.needsRewrite = true;
  try { return JSON.parse(raw); } catch (e) { return null; }
}
const lockRecord = () => { try { return JSON.parse(localStorage.getItem(LS_LOCK) || 'null'); } catch (e) { return null; } };
async function newDeviceKey(pass) {
  const salt = rnd(16), key = await kdf(pass, salt);
  localStorage.setItem(LS_LOCK, JSON.stringify({salt: b64(salt), check: await enc(key, te.encode('protocol'))}));
  return key;
}
async function deviceKey(pass) {
  const rec = lockRecord(); if (!rec) return newDeviceKey(pass);
  const key = await kdf(pass, unb64(rec.salt));
  try { await dec(key, rec.check); return key; } catch (e) { return null; }
}
// called by the app: builds a locked index.html and re-keys this device's data
B.setPassword = async pass => {
  const salt = rnd(16), box = await enc(await kdf(pass, salt), te.encode(B.html));
  const doc = new DOMParser().parseFromString(SRC, 'text/html');
  doc.getElementById('payload').textContent = JSON.stringify({mode: 'locked', iter: ITER, salt: b64(salt), iv: box.iv, data: box.data});
  B.key = await newDeviceKey(pass); B.locked = true;
  return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
};

async function mount(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html'), scripts = [...doc.querySelectorAll('script')];
  scripts.forEach(s => s.remove());
  document.head.innerHTML = doc.head.innerHTML;
  document.body.innerHTML = doc.body.innerHTML;
  for (const s of scripts) {
    await new Promise(res => {
      const n = document.createElement('script');
      [...s.attributes].forEach(a => n.setAttribute(a.name, a.value));
      if (s.src) { n.onload = n.onerror = () => res(); document.head.appendChild(n); }
      else { n.textContent = s.textContent; document.body.appendChild(n); res(); }
    });
  }
}
async function open(html, key, data) {
  B.html = html; B.key = key;
  if (data) { B.stored = data.stored; B.cfg = data.cfg; B.needsRewrite = true; }
  else { B.stored = await readLS(LS_STATE, key); B.cfg = await readLS(LS_CFG, key); }
  await mount(html);
}

let pending = null;
const msg = t => { $('gMsg').textContent = t; };
const busy = (btn, on, label) => { btn.disabled = on; btn.textContent = on ? 'Unlocking…' : label; };
function showGate(hint) {
  $('gate').hidden = false; if (hint) $('gHint').textContent = hint;
  setTimeout(() => $('gPass').focus(), 50);
}
$('gForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pass = $('gPass').value; if (!pass) return;
  busy($('gBtn'), true); msg('');
  try {
    let html;
    if (P.mode === 'locked') {
      try { html = td.decode(await dec(await kdf(pass, unb64(P.salt), P.iter), P)); }
      catch (err) { if (/https/.test(err.message)) throw err; msg('Wrong password'); busy($('gBtn'), false, 'Unlock'); $('gPass').select(); return; }
    } else html = td.decode(unb64(P.data));
    const key = await deviceKey(pass);
    if (!key) {
      if (P.mode !== 'locked') { msg('Wrong password'); busy($('gBtn'), false, 'Unlock'); return; }
      pending = {html, pass}; $('gForm').style.display = 'none'; $('gOld').classList.add('on'); $('gOldPass').focus(); return;
    }
    await open(html, key);
  } catch (err) { msg(err.message); busy($('gBtn'), false, 'Unlock'); }
});
$('gOldBtn').addEventListener('click', async () => {
  const old = $('gOldPass').value, rec = lockRecord(); if (!old || !pending || !rec) return;
  busy($('gOldBtn'), true); msg('');
  const oldKey = await kdf(old, unb64(rec.salt));
  try { await dec(oldKey, rec.check); } catch (e) { msg('That’s not it either'); busy($('gOldBtn'), false, 'Continue'); return; }
  const data = {stored: await readLS(LS_STATE, oldKey), cfg: await readLS(LS_CFG, oldKey)};
  await open(pending.html, await newDeviceKey(pending.pass), data);
});
$('gReset').addEventListener('click', async () => {
  if (!pending || !confirm('Erase this device’s copy? Your data on GitHub and other devices is not affected — you can sync it back after re-entering your GitHub details.')) return;
  [LS_STATE, LS_CFG, LS_LOCK].forEach(k => localStorage.removeItem(k));
  await open(pending.html, await newDeviceKey(pending.pass));
});

if (P.mode === 'locked') showGate();
else if (lockRecord()) showGate('Enter your app password to open this device’s data');
else open(td.decode(unb64(P.data)), null).catch(err => { document.body.textContent = 'Couldn’t start: ' + err.message; });
})();
</script>
